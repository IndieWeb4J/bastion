name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Hermetic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run hermetic tests
        run: |
          ./gradlew test \
            --tests "dev.jacobandersen.bastion.microformats2.*" \
            --tests "dev.jacobandersen.bastion.webmention.*" \
            --tests "dev.jacobandersen.bastion.micropub.data.model.*" \
            --tests "dev.jacobandersen.bastion.micropub.url.*"

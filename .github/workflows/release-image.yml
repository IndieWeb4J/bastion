name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  BASTION_TIMEZONE: Asia/Manila
  BASTION_PUBLIC_URL: https://bastion.test
  BASTION_CONTENT_BASE_URL: https://bastion.test
  BASTION_PATH_PATTERN: "{year}/{month}/{day}/{slug}"
  BASTION_MEDIA_BASE_URL: https://media.bastion.test
  BASTION_MEDIA_S3_ACCESS_KEY_ID: test-access-key
  BASTION_MEDIA_S3_SECRET_ACCESS_KEY: test-secret-key
  BASTION_MEDIA_S3_ENDPOINT: https://s3.bastion.test
  BASTION_MEDIA_S3_REGION: us-east-1
  BASTION_MEDIA_S3_BUCKET: bastion-test
  BASTION_INDIEAUTH_VALIDATE_TOKEN_URL: https://tokens.indieauth.com/token
  SPRING_PG_HOST: localhost
  SPRING_PG_PORT: "5432"
  SPRING_PG_DB: bastion
  SPRING_PG_USERNAME: postgres
  SPRING_PG_PASSWORD: postgres

jobs:
  native-image:
    name: Verify and build distroless native image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: graalvm-community
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full integration tests
        run: ./gradlew test

      - name: Build native image
        run: ./gradlew nativeCompile

      - name: Stage native binary for docker
        run: cp build/native/nativeCompile/bastion ./bastion

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jacobsandersen/bastion
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

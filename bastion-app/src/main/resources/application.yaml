bastion:
  timezone: ${BASTION_TIMEZONE}
  public-url: ${BASTION_PUBLIC_URL}
  content:
    base-url: ${BASTION_CONTENT_BASE_URL}
    path-pattern: ${BASTION_PATH_PATTERN}
    internal:
      token: ${BASTION_CONTENT_INTERNAL_TOKEN:}
    events:
      nats:
        enabled: ${BASTION_CONTENT_EVENTS_NATS_ENABLED:false}
        url: ${BASTION_CONTENT_EVENTS_NATS_URL:nats://localhost:4222}
        replicas: ${BASTION_CONTENT_EVENTS_NATS_REPLICAS:1}
        content-stream: ${BASTION_CONTENT_EVENTS_NATS_STREAM:CONTENT}
        content-subject: ${BASTION_CONTENT_EVENTS_NATS_SUBJECT:content.>}
        webmention-stream: ${BASTION_CONTENT_EVENTS_NATS_WEBMENTION_STREAM:WEBMENTION}
        syndication-stream: ${BASTION_CONTENT_EVENTS_NATS_SYNDICATION_STREAM:SYNDICATION}
  media:
    base-url: ${BASTION_MEDIA_BASE_URL}
    s3:
      access-key-id: ${BASTION_MEDIA_S3_ACCESS_KEY_ID}
      secret-access-key: ${BASTION_MEDIA_S3_SECRET_ACCESS_KEY}
      endpoint: ${BASTION_MEDIA_S3_ENDPOINT}
      region: ${BASTION_MEDIA_S3_REGION}
      bucket: ${BASTION_MEDIA_S3_BUCKET}
    orphan-sweep:
      enabled: ${BASTION_MEDIA_ORPHAN_SWEEP_ENABLED:false}
      ttl-hours: ${BASTION_MEDIA_ORPHAN_SWEEP_TTL_HOURS:168}
  cors:
    allowed-origins: ${BASTION_CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${BASTION_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${BASTION_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${BASTION_CORS_EXPOSED_HEADERS:}
    allow-credentials: ${BASTION_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${BASTION_CORS_MAX_AGE:3600}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}

spring:
  config:
    import: file:${BASTION_POST_TYPES_CONFIG_FILE:/etc/config/post-types.yaml}
  application:
    name: bastion
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${SPRING_PG_HOST}:${SPRING_PG_PORT:5432}/${SPRING_PG_DB}
    username: ${SPRING_PG_USERNAME}
    password: ${SPRING_PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jobrunr:
  background-job-server:
    enabled: ${JOBRUNR_BACKGROUND_JOB_SERVER:true}
  dashboard:
    enabled: ${JOBRUNR_DASHBOARD_ENABLE:true}
  database:
    type: sql

    read-timeout-seconds: 10
  websub:
    hubs: ""
    topic-url: ""
    connect-timeout-seconds: 10
    read-timeout-seconds: 10
  cors:
    allowed-origins: http://localho.st:8080
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: [ ]
    allow-credentials: false
    max-age: 3600
  micropub:
    syndication:
      targets:
        - uid: test-bridgy
          name: Test Bridgy
          endpoint: https://example.org/micropub
          token: ""
          actions:
            - CREATE
            - DELETE

sigil:
  client:
    base-url: https://ea2c-2a09-bac1-5ae0-1318-00-4d-20.ngrok-free.app

logging:
  level:
    root: info

spring:
  application:
    name: bastion
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/bastion
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  graphql:
    schema:
      inspection:
        enabled: true
      introspection:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-version: 0
    baseline-on-migrate: true
    clean-disabled: false

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
  database:
    type: sql

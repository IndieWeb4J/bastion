  sigil:
    me: https://ea2c-2a09-bac1-5ae0-1318-00-4d-20.ngrok-free.app
  webmention:
    retry-interval-minutes: 30
    max-attempts: 5
    backoff-base-seconds: 1800
    backoff-max-seconds: 86400
